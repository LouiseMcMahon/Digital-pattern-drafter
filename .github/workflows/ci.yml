name: CI
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # First stage: if the tests cannot catch a change to the core geometry code, nothing after this means much.
  # One job per module so they run in parallel; each fails if its mutation score is below the minimum in
  # mutation-thresholds.json (ENGINEERING.md, "Mutation testing").
  mutation:
    name: mutation testing (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 120 # bodyModel takes about 24 minutes on a 4-core machine; runners may be slower
    strategy:
      fail-fast: false
      matrix:
        module: [slice, pose, bodyModel, flatten, mesh, ease, lscm, body]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mutate -- ${{ matrix.module }} --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-${{ matrix.module }}
          path: reports/mutation/
          if-no-files-found: ignore

  check:
    name: typecheck, tests with coverage thresholds, build
    needs: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Runs every test (golden snapshots, pose, invariants, smoothness, R1/R2 fixtures) and enforces
      # the coverage thresholds in vitest.config.ts.
      - run: npm run coverage
      - run: npm run build

  e2e:
    name: end-to-end smoke test in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-out/

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Digital Pattern Drafter</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-columns: 260px 1fr 1fr; height: 100vh; }
  aside { padding: 12px; overflow: auto; border-right: 1px solid #ccc; }
  label { display: block; margin: 8px 0 2px; }
  input[type=range], select { width: 100%; }
  #three, #flat { min-width: 0; min-height: 0; }
  #flat svg { width: 100%; height: 100%; }
  #report { margin-top: 12px; padding: 8px; border-radius: 6px; }
  .ok { background: #e3f6e3; } .bad { background: #fbe0e0; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: auto 40vh 40vh; height: auto; } }
</style>
</head>
<body>
<aside id="controls"></aside>
<div id="three"></div>
<div id="flat"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>

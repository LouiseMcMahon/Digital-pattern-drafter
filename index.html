<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Digital Pattern Drafter</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --bg: #f6f5f3; --panel: #ffffff; --line: #e4e1dc; --text: #25221f; --muted: #7a746c;
    --accent: #6a4c93; --accent-weak: #efe9f6; --ok: #1a7f3c; --bad: #c0222f; --warn: #9a6200;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1b1a; --panel: #2a2725; --line: #3b3835; --text: #ece8e3; --muted: #9d968d; --accent: #b79ae0; --accent-weak: #3a3046; --ok: #5fcf85; --bad: #ff7b86; --warn: #e6b04d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; color: var(--text); background: var(--bg); display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside { overflow: auto; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .head { padding: 14px 14px 8px; }
  .head h1 { font-size: 15px; margin: 0; letter-spacing: .01em; }
  .head p { margin: 2px 0 0; color: var(--muted); }
  details { border-top: 1px solid var(--line); }
  summary { cursor: pointer; padding: 10px 14px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; user-select: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: '▸'; color: var(--muted); font-size: 11px; transition: transform .12s; }
  details[open] > summary::before { transform: rotate(90deg); }
  summary .n { background: var(--accent-weak); color: var(--accent); border-radius: 9px; padding: 0 7px; font-size: 11px; font-weight: 600; }
  .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 0 0 auto; }
  .row .grow { flex: 1 1 0; min-width: 0; }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }
  button, select, input[type=number] { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.active { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); }
  button.danger { color: var(--bad); }
  button:disabled, select:disabled, input:disabled { opacity: .5; cursor: default; }
  select { max-width: 100%; }
  table { border-collapse: collapse; width: 100%; }
  th { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 2px 4px; text-align: right; }
  td { padding: 2px 4px; text-align: right; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  td:first-child, th:first-child { text-align: left; padding-left: 0; }
  td:first-child { white-space: nowrap; }
  td input[type=number] { width: 62px; padding: 3px 6px; text-align: right; }
  .switch { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .switch input { margin-top: 2px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); font-weight: 600; } .warn { color: var(--warn); }
  .muted { color: var(--muted); }
  .item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
  .item.error { border-color: var(--bad); }
  .item-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item-head b { flex: 1 1 auto; }
  .item input[type=number] { width: 52px; padding: 2px 5px; }
  .item label { display: inline-flex; align-items: center; gap: 4px; }
  .sides { color: var(--muted); font-size: 12px; }
  #flat { background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  #status { margin: auto 0 0; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--bg); position: sticky; bottom: 0; }
  #three { min-width: 0; min-height: 0; position: relative; }
  .busy { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: color-mix(in srgb, var(--bg) 70%, transparent); color: var(--text); z-index: 5; cursor: progress; }
  .busy.on { display: flex; }
  .busy .spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .busy .bar { width: min(280px, 70%); height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .busy .bar div { height: 100%; width: 0; background: var(--accent); transition: width 0.15s linear; }
  #busy-text { font-weight: 600; }
  #busy-detail { max-width: 340px; padding: 0 16px; text-align: center; color: var(--muted); font-size: 12px; }
  .viewbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.12); }
  .viewbar button { border: 0; border-radius: 0; border-right: 1px solid var(--line); padding: 6px 12px; }
  .viewbar button:last-child { border-right: 0; }
  #snap { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; }
  #snap:empty { display: none; }
  #hover { position: fixed; display: none; pointer-events: none; z-index: 10; background: var(--panel); border: 1px solid var(--line); padding: 2px 7px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; } aside { border-right: 0; } }
</style>
</head>
<body>
<aside id="controls"></aside>
<div id="three"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
